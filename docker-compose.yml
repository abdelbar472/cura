services:
  postgres:
    image: postgres:16-alpine
    container_name: cura-postgres
    environment:
      POSTGRES_USER: cura
      POSTGRES_PASSWORD: cura
      POSTGRES_DB: cura
    ports:
      - "5433:5432"
    volumes:
      - cura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cura -d cura"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cura_pgdata:
